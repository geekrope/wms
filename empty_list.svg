<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="120" height="120" fill="none">
  <!-- Subtle background glow/circle -->
  <circle cx="80" cy="80" r="64" fill="#f1f5f9" opacity="0.7"/>

  <!-- List Document / Sheet -->
  <rect x="42" y="30" width="76" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>

  <!-- Sheet Clip / Header Bar -->
  <rect x="58" y="24" width="44" height="12" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Row 1: Checkbox + Dashed placeholder line -->
  <rect x="54" y="48" width="12" height="12" rx="3" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="72" y1="54" x2="106" y2="54" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Row 2: Checkbox + Dashed placeholder line -->
  <rect x="54" y="68" width="12" height="12" rx="3" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="72" y1="74" x2="106" y2="74" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Row 3: Checkbox + Short Dashed placeholder line -->
  <rect x="54" y="88" width="12" height="12" rx="3" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="72" y1="94" x2="92" y2="94" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Floating "Empty" Badge / Open Box on the bottom right -->
  <g transform="translate(90, 88)">
    <!-- Badge Background -->
    <circle cx="20" cy="20" r="18" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
    <!-- Small open box icon inside badge -->
    <path d="M12 16 L20 12 L28 16 L20 20 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M12 16 L12 24 L20 28 L20 20 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M28 16 L28 24 L20 28 L20 20 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>